# https://firebase.google.com/docs/app-hosting/configure
# Last updated: 2026-07-28T11:30:00Z

runConfig:
  minInstances: 1
  maxInstances: 10
  cpu: 2
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_PAYPAL_CLIENT_ID
    value: Aarp0NdbJhRcD1q9gAJEECDoUfgOlDOw_nyFhKKE1EsgnDuIm44PIVNGGtiIWhbHYzxTwN3plsQ15MeQ
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://app.pixiatech.com
    availability:
      - BUILD
      - RUNTIME

  - variable: SESSION_SECRET
    secret: SESSION_SECRET
    availability:
      - RUNTIME

  # Firebase Admin SDK — required for session cookie creation
  - variable: ADMIN_PROJECT_ID
    value: pixiatech-client
    availability:
      - RUNTIME

  - variable: ADMIN_CLIENT_EMAIL
    value: firebase-admin@pixiatech-client.iam.gserviceaccount.com
    availability:
      - RUNTIME

  # ADMIN_PRIVATE_KEY must be stored in Google Secret Manager.
  # Create it once with:
  #   gcloud secrets create ADMIN_PRIVATE_KEY --project=pixiatech-client
  #   gcloud secrets versions add ADMIN_PRIVATE_KEY --data-file=private_key.txt --project=pixiatech-client
  - variable: ADMIN_PRIVATE_KEY
    secret: ADMIN_PRIVATE_KEY
    availability:
      - RUNTIME

  # Gemini API key (server-side route /api/gemini) must be stored in Secret Manager.
  # Create it once with:
  #   gcloud secrets create GEMINI_API_KEY --project=pixiatech-client
  #   gcloud secrets versions add GEMINI_API_KEY --data-file=gemini_key.txt --project=pixiatech-client
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
